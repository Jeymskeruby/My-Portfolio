<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizer Login | iServe</title>
    <link rel="stylesheet" href="../style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        secondary: '#1e40af'
                    }
                }
            }
        }
    </script>
    
    <style>
        [x-cloak] { display: none !important; }
        .feather { stroke-width: 2.5; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 antialiased">
    <custom-header></custom-header>
    <main class="container mx-auto px-4 py-12 flex items-center justify-center">
        <div class="container mx-auto px-4 flex items-center justify-center">
            <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-bold text-primary mb-2">Organizer Login</h1>
                    <p class="text-gray-600">Login with your username and password</p>
                </div>
                
                <form id="loginForm" class="space-y-6">
                    <div id="errorMessage" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4"></div>
                    <div id="successMessage" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4"></div>
                    
                    <div>
                        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                        <input type="text" id="username" name="username" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-primary focus:border-primary"
                            placeholder="Enter your username">
                    </div>
                    
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                        <input type="password" id="password" name="password" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-primary focus:border-primary"
                            placeholder="Enter your password">
                    </div>
                    
                    <button type="submit" class="w-full bg-primary hover:bg-secondary text-white font-semibold py-3 px-6 rounded-lg shadow-md transition duration-300 transform hover:scale-105">Login</button>
                    
                    <div class="text-center text-sm text-gray-600">
                        Don't have an organizer account? <a href="../organizer-signup/organizer-signup.html" class="text-red-600 hover:underline">Sign up</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Fixed Modal -->
    <div id="centeredModalOverlay" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
        <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
            <div class="mt-3 text-center">
                <h3 id="modalTitle" class="text-lg font-medium text-gray-900"></h3>
                <div class="mt-2 px-7 py-3">
                    <p id="modalMessage" class="text-sm text-gray-500 whitespace-pre-line"></p>
                </div>
                <div class="flex justify-center gap-4 px-4 py-3">
                    <button id="modalResubmitBtn" 
                        class="px-4 py-2 bg-blue-600 text-white text-base font-medium rounded-md shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-300 hidden">
                        Apply Again
                    </button>
                    <button id="modalCloseBtn" 
                        class="px-4 py-2 bg-gray-600 text-white text-base font-medium rounded-md shadow-sm hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-gray-300">
                        Close
                    </button>
                </div>
            </div>
        </div>
    </div>

    <custom-footer></custom-footer>
    <script src="../components/footer.js"></script>
    <script src="../components/header.js"></script>
    <!-- Firebase -->
    <script src="../mock-seed-data.js"></script>
    <script src="../mock-firebase.js"></script>
    <script src="../demo-banner.js"></script>
    <script src="../script.js"></script>   
    <script src="organizer-login.js"></script>
</body>
</html>
