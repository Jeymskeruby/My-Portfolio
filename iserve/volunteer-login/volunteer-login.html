<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | iServe</title>
    <link rel="stylesheet" href="../style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <custom-header></custom-header>

    <main class="container mx-auto px-4 py-12 flex items-center justify-center">
        <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
            <h1 class="text-3xl font-bold text-blue-600 mb-8 text-center">Volunteer Login</h1>
            <form id="loginForm" class="space-y-6">
                <div id="errorMessage" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4"></div>
                <div id="successMessage" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4"></div>
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="email" name="email" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-primary focus:border-primary">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" name="password" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-primary focus:border-primary">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg shadow-md transition duration-300 transform hover:scale-105">Login</button>
                <div class="text-center text-sm text-gray-600">
                    Don't have an account? <a href="../volunteer-signup/volunteer-signup.html" class="text-red-600 hover:underline">Sign up</a>
                </div>
            </form>
        </div>
    </main>
    <!-- Modal for error/message -->
    <div id="centeredModalOverlay" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-xl p-8 max-w-md text-center border-2 border-gray-200">
            <h2 id="modalTitle" class="text-xl font-bold text-gray-800 mb-4"></h2>
            <p id="modalMessage" class="text-gray-700 mb-6"></p>
            <button id="modalCloseBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-8 rounded-lg transition">Close</button>
        </div>
    </div>
    <custom-footer></custom-footer>
    <script src="../components/header.js"></script>
    <script src="../components/footer.js"></script>
    <script src="../mock-seed-data.js"></script>
    <script src="../mock-firebase.js"></script>
    <script src="../demo-banner.js"></script>
    <script src="../script.js"></script>
    <script src="volunteer-login.js"></script>
</body>
</html>
