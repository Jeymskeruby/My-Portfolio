    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign Up | iServe</title>
        <link rel="stylesheet" href="../style.css">
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    </head>

    <body class="bg-gray-50 min-h-screen">
        <custom-header></custom-header>

        <main class="container mx-auto px-4 py-12 flex items-center justify-center">
            <!-- Increased width from max-w-md to max-w-lg -->
            <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-lg">
                <h1 class="text-3xl font-bold text-blue-600 mb-8 text-center">Registration Form</h1>

                <form id="signupForm" class="space-y-6">
                    <div id="errorMessage" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4"></div>
                    <div id="successMessage" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4"></div>

                    <!-- First Name and Last Name Side by Side -->
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
                            <input type="text" id="firstName" required class="w-full px-4 py-2 border rounded-md focus:ring-primary focus:border-primary">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
                            <input type="text" id="lastName" required class="w-full px-4 py-2 border rounded-md focus:ring-primary focus:border-primary">
                        </div>
                    </div>

                    <!-- Username -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                        <input type="text" id="username" required class="w-full px-4 py-2 border rounded-md focus:ring-primary focus:border-primary">
                    </div>

                    <!-- Email -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                        <input type="email" id="email" required class="w-full px-4 py-2 border rounded-md focus:ring-primary focus:border-primary">
                    </div>

                    <!-- Password -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                        <input type="password" id="password" required class="w-full px-4 py-2 border rounded-md focus:ring-primary focus:border-primary">
                    </div>

                    <!-- Confirm Password -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                        <input type="password" id="confirmPassword" required class="w-full px-4 py-2 border rounded-md focus:ring-primary focus:border-primary">
                        <p id="passwordError" class="hidden text-red-500 text-sm mt-1">Passwords do not match</p>
                    </div>

                    <!-- Terms -->
                    <div class="flex items-center">
                        <input type="checkbox" id="terms" required class="h-4 w-4 text-primary border-gray-300">
                        <label for="terms" class="ml-2 text-sm text-gray-700">
                            I agree to the <a href="terms.html" target="_blank" rel="noopener" class="text-primary underline">terms and conditions</a>
                        </label>
                    </div>

                    <!-- Submit -->
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg shadow-md">
                        Register
                    </button>

                    <div class="text-center text-sm text-gray-600">
                        Already have an account? 
                        <a href="../volunteer-login/volunteer-login.html" class="text-green-600 hover:underline font-medium">Login</a>
                    </div>
                </form>
            </div>
        </main>

        <!-- Email Verification Modal -->
        <div id="verifyEmailModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md mx-4 text-center">
                <i data-feather="mail" class="w-12 h-12 text-primary mx-auto mb-4"></i>
                <h2 class="text-2xl font-bold mb-2">Verify Your Email</h2>
                <p class="text-gray-600 mb-6">Please check your email for a verification link.</p>
                <button id="checkVerificationBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-lg">
                    I've Verified My Email
                </button>
            </div>
        </div>

        <!-- Additional Details Modal - Increased width -->
        <div id="detailsFormModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 overflow-y-auto py-4">
            <div class="bg-white p-6 rounded-xl shadow-md w-full max-w-4xl mx-4 my-4 max-h-[90vh] overflow-y-auto">
                <h2 class="text-2xl font-bold text-primary mb-6 text-center">Complete Additional Details</h2>

                <form id="detailsForm" class="space-y-4">

                    <!-- Phone and Birthdate Side by Side -->
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium">Phone Number</label>
                            <input type="text" id="phoneNumber" class="w-full px-4 py-2 border rounded-md">
                        </div>
                        <div>
                            <label class="block text-sm font-medium">Birthdate</label>
                            <input type="date" id="birthdate" class="w-full px-4 py-2 border rounded-md">
                        </div>
                    </div>

                    <!-- Gender -->
                    <div>
                        <label class="block text-sm font-medium mb-2">Gender</label>
                        <div class="flex gap-4">
                            <label class="flex items-center gap-1"><input type="radio" name="gender" value="Male"> Male</label>
                            <label class="flex items-center gap-1"><input type="radio" name="gender" value="Female"> Female</label>
                            <label class="flex items-center gap-1"><input type="radio" name="gender" value="Prefer not to say"> Prefer not to say</label>
                        </div>
                    </div>

                    <!-- Address -->
                    <div class="space-y-3">
                        <h3 class="text-lg font-medium text-gray-700 border-b pb-2">Address</h3>
                        <div>
                            <label class="block font-medium text-sm">Street Address</label>
                            <input type="text" id="street" class="w-full border rounded-md px-4 py-2" placeholder="Enter your street address">
                        </div>
                        <div>
                            <label class="block font-medium text-sm">Province</label>
                            <input type="text" id="province" class="w-full border rounded-md px-4 py-2" placeholder="Enter your province">
                        </div>
                        <div>
                            <label class="block font-medium text-sm">Municipality/City</label>
                            <input type="text" id="municipality" class="w-full border rounded-md px-4 py-2" placeholder="Enter your municipality or city">
                        </div>
                        <div>
                            <label class="block font-medium text-sm">Barangay</label>
                            <input type="text" id="barangay" class="w-full border rounded-md px-4 py-2" placeholder="Enter your barangay">
                        </div>
                    </div>

                    <!-- Availability Dropdowns -->
                    <div>
                        <label class="block text-sm font-medium mb-2">Availability</label>
                        <div class="flex gap-3">
                            <select id="availabilityDay" class="w-1/2 border rounded-md px-3 py-2">
                                <option value="Weekdays">Weekdays</option>
                                <option value="Weekends">Weekends</option>
                                <option value="Both">Both</option>
                            </select>

                            <select id="availabilityTime" class="w-1/2 border rounded-md px-3 py-2">
                                <option value="Morning">Morning</option>
                                <option value="Afternoon">Afternoon</option>
                                <option value="Both">Both</option>
                            </select>
                        </div>
                    </div>

                    <!-- Skills Dropdown with Chips -->
                    <div class="relative">
                        <label class="block text-sm font-medium mb-2">Skills</label>
                        <div class="relative">
                            <div id="skillsDropdown" class="w-full border rounded-md px-3 py-2 bg-white cursor-pointer min-h-12 flex items-center flex-wrap gap-2">
                                <span id="skillsPlaceholder" class="text-gray-500">Select skills...</span>
                                <div id="selectedSkills" class="flex flex-wrap gap-2"></div>
                            </div>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700">
                                <i data-feather="chevron-down" class="w-4 h-4"></i>
                            </div>
                        </div>
                        
                        <!-- Skills Dropdown Content -->
                        <div id="skillsDropdownContent" class="hidden absolute z-10 w-full mt-1 bg-white border border-gray-300 rounded-md shadow-lg max-h-64 overflow-y-auto">
                            <div class="p-3">
                                <div id="skillsCheckboxContainer" class="grid grid-cols-3 gap-3">
                                    <!-- Skills checkboxes will be populated here -->
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Interests Dropdown with Chips -->
                    <div class="relative">
                        <label class="block text-sm font-medium mb-2">Interests</label>
                        <div class="relative">
                            <div id="interestsDropdown" class="w-full border rounded-md px-3 py-2 bg-white cursor-pointer min-h-12 flex items-center flex-wrap gap-2">
                                <span id="interestsPlaceholder" class="text-gray-500">Select interests...</span>
                                <div id="selectedInterests" class="flex flex-wrap gap-2"></div>
                            </div>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700">
                                <i data-feather="chevron-down" class="w-4 h-4"></i>
                            </div>
                        </div>
                        
                        <!-- Interests Dropdown Content -->
                        <div id="interestsDropdownContent" class="hidden absolute z-10 w-full mt-1 bg-white border border-gray-300 rounded-md shadow-lg max-h-64 overflow-y-auto">
                            <div class="p-3">
                                <div id="interestsCheckboxContainer" class="grid grid-cols-3 gap-3">
                                    <!-- Interests checkboxes will be populated here -->
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="flex justify-between pt-4 border-t">
                        <button type="button" id="skipDetailsBtn" class="bg-gray-300 hover:bg-gray-400 text-gray-800 py-2 px-6 rounded-lg transition-colors">Skip</button>
                        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white py-2 px-6 rounded-lg transition-colors">Submit</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Centered Modal -->
        <div id="centeredModalOverlay" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div class="bg-white rounded-xl shadow-xl p-8 max-w-md text-center border-2 border-gray-200">
                <h2 id="modalTitle" class="text-xl font-bold mb-4"></h2>
                <p id="modalMessage" class="mb-6"></p>
                <button id="modalCloseBtn" class="bg-blue-600 hover:bg-blue-700 text-white py-2 px-8 rounded-lg">Close</button>
            </div>
        </div>

        <custom-footer></custom-footer>

        <script src="../components/header.js"></script>
        <script src="../components/footer.js"></script>
        <script src="../mock-seed-data.js"></script>
    <script src="../mock-firebase.js"></script>
    <script src="../demo-banner.js"></script>
    <script src="../script.js"></script>
        <script src="volunteer-signup.js"></script>

        <style>
            .chip {
                display: inline-flex;
                align-items: center;
                background-color: #3b82f6;
                color: white;
                padding: 0.25rem 0.75rem;
                border-radius: 9999px;
                font-size: 0.875rem;
                margin: 0.125rem;
            }
            
            .chip button {
                margin-left: 0.5rem;
                background: none;
                border: none;
                cursor: pointer;
                color: white;
                font-size: 1rem;
                line-height: 1;
                opacity: 0.8;
            }
            
            .chip button:hover {
                opacity: 1;
            }
            
            .dropdown-open {
                border-color: #3b82f6;
                border-width: 2px;
            }
            
            select {
                background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='m6 8 4 4 4-4'/%3e%3c/svg%3e");
                background-position: right 0.5rem center;
                background-repeat: no-repeat;
                background-size: 1.5em 1.5em;
                padding-right: 2.5rem;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        </style>
    </body>
    </html>
